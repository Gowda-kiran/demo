# Name shown in the repo's Actions tab
name: CI

# WHEN to run: every push to the dev branch
on:
  push:
    branches:
      - dev

# WHAT the workflow is allowed to do
permissions:
  contents: read     # read the code in this repo
  packages: write    # push images to GitHub Container Registry (GHCR)

jobs:
  build:                      # the job's name (you choose it)
    runs-on: ubuntu-latest    # WHERE: a fresh Linux machine provided by GitHub

    steps:                    # a list of steps, run top to bottom
      # 1. Download your repo's code onto the machine
      - name: Check out code
        uses: actions/checkout@v5

      # 2. Install Java 25 (same as your pom.xml) and cache Maven downloads
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # 3. Build the JAR (also runs your tests). Must happen BEFORE the
      #    Docker build, because the Dockerfile copies the JAR from target/
      - name: Build JAR with Maven
        run: ./mvnw clean package

      # 4. Log in to GHCR. GITHUB_TOKEN is created automatically for each run,
      #    so you don't need to create any secret yourself.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5. Build the image using your Dockerfile and push it to GHCR.
      #    The tag is the commit ID, so every build is unique and traceable.
      #    Image names must be ALL LOWERCASE (gowda-kiran, not Gowda-kiran).
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/gowda-kiran/demo:${{ github.sha }}